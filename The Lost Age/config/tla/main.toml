count = 16
format = "abs32"
entries_mode = "thumb"
note = "dispatcher 0x08041CCA: cmp r3,#0xf; bhi; ldr r2,=0x08041CD8 (literal 0x08041F58); ldr r3,[r3,r2]; mov pc,r3. Run missed case 0x08041D18"

[[jump_table]]
