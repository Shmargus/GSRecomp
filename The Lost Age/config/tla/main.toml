note = "dispatcher 0x080AD988: cmp r3,#7; bhi; ldr r2,=0x080AD994 (literal 0x080ADBE8); ldr r3,[r3,r2]; mov pc,r3. Run missed cases 0x080AD9B4..0x080AD9D4"

