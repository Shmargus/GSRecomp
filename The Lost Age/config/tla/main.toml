# Golden Sun: The Lost Age (USA/Europe) main image.
#
# No outside symbol list: every function is found by gba_recompile walking the
# code from the reset vector. Pointers sitting in data are NOT treated as code
# (speculative_literal_harvest = false): a missed function becomes a loud
# dispatch miss at runtime, which we then add here with evidence, instead of
# decoding data as code. Regenerate with scripts/tla_recompile.ps1.

[program]
name = "Golden Sun: The Lost Age (USA/Europe) main image"
id = "golden_sun_tla_usa_main"
load_address = 0x08000000
size = 0x01000000
entry_pc = 0x08000000
speculative_literal_harvest = false
codegen_shards = 32

[identity]
sha1 = "b500663220cb9bf56b9f8e8c0c544f1d6fa3a824"

# Boot copies the IRQ handler and the fast IWRAM routines into IWRAM:
# Func 0x080133c4 DMA3s 0x400 words from 0x080006b8 to 0x03000100 (literals at
# 0x08013418/0x0801341c/0x08013420 = src/dst/0x84000400) and stores 0x03000100
# at 0x03007ffc (the IRQ vector). It then DMAs 14 words from 0x080178b4 to
# 0x030001e4 -- the handler's table of IRQ routine pointers (data, not code).
[[code_copy]]
runtime_start = 0x03000100
source_start = 0x080006b8
size = 0x00001000
name = "iwram_copy_03000100"
note = "DMA3 in 0x080133c4, measured from its literal pool"

# The IRQ handler: the address the boot code stores at 0x03007ffc. First run
# (2026-10-03) missed it and the interpreter bridge could not run it.
[[extra_func]]
addr = 0x03000100
mode = "arm"
name = "IrqHandler"

# Entry points reached only through Thumb veneers `ldr rX,[pc,#0]; bx rX`
# whose literal points into the copy (bit 0 clear = ARM, set = Thumb).
[[extra_func]]
addr = 0x03000508
mode = "arm"
name = "Iwram_508"
note = "veneer at 0x08002064"

[[extra_func]]
addr = 0x03000514
mode = "arm"
name = "Iwram_514"
note = "veneer at 0x0800206c"

[[extra_func]]
addr = 0x03000528
mode = "arm"
name = "Iwram_528"
note = "veneer at 0x08002054; first run missed it"

[[extra_func]]
addr = 0x03000534
mode = "arm"
name = "Iwram_534"
note = "veneer at 0x0800205c"

[[extra_func]]
addr = 0x030007b4
mode = "thumb"
name = "Iwram_7b4"
note = "veneer at 0x080006a0 (literal 0x030007b5)"

# IRQ routine pointers the boot code DMAs from 0x080178b4 to 0x030001e4
# (14 words, all THUMB): 0x080133c1 (a bare `bx lr`) and 0x08013b41.
[[extra_func]]
addr = 0x080133c0
mode = "thumb"
name = "IrqNone"
note = "0x080178b4 table, 13 of 14 slots"

[[extra_func]]
addr = 0x08013b40
mode = "thumb"
name = "Irq_13b40"
note = "0x080178b4 table, slot 12"

# Reached only through a pointer; second run (2026-10-03) missed it. Starts
# with `push {r5, r6, r7, lr}` right after 0x08013988's literal pool.
[[extra_func]]
addr = 0x0801399c
mode = "thumb"
name = "Func_1399c"

# ---------------------------------------------------------------------------
# Round 1 of folding the first run's misses (2026-10-03 headless run, 1200
# frames, recomp_master_misses_AGFE.toml.frag). Every address below was a
# logged dispatch miss or is the function/table that contains one.

# Switch statements the walk could not size. The compiler's form is
# `cmp rI,#N; b{hi,ls}; ldr rB,=table; lsls rT,rI,#2; ldr rT,[rT,rB];
# mov pc,rT` (the walk only recognizes an ADD or a scaled load there).
# `mov pc` stays in Thumb, so the table words are Thumb case labels with
# bit 0 clear. Count = N+1 from the guard compare.
[[jump_table]]
addr = 0x0803AB4C
stride = 4
count = 27
format = "abs32"
entries_mode = "thumb"
note = "dispatcher 0x0803AB3E: cmp r1,#0x1a; bls; ldr r2,=0x0803AB4C (literal 0x0803AC58); ldr r3,[r3,r2]; mov pc,r3. Run missed case 0x0803ABB8"

[[jump_table]]
addr = 0x0803B9A4
stride = 4
count = 29
format = "abs32"
entries_mode = "thumb"
note = "dispatcher 0x0803B996: cmp r2,#0x1c; bhi; ip=0x0803B9A4 (literal 0x0803BAD0); ldr r3,[r3,r2]; mov pc,r3. Run missed case 0x0803BA90"

[[jump_table]]
