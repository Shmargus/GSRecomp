# GS-011 POSITION-INDEPENDENT AOT image for Func_1dc8.
#
# Func_1dc8 is one of the routines the flash driver copies into its
# relocatable working area. Three bases are known - 0x03002400, 0x0300387c
# and 0x03003f9c - and the third only surfaced when the campaign input track
# reached it, which is exactly why the base set must not be enumerated.
#
# Generated with `gba_recompile --relocatable-image 0x03002400:0xe0`: every
# guest address the image derives from its own PC is emitted as
# g_runtime_image_base + offset. 0x03002400 is the generation ORIGIN only.
# It is ADDITIVE to the two fixed registrations at 0x03002400 and 0x0300387c:
# those rows are the identity gate for PCs the main corpus already owns
# statically, and removing them would let an unknown image at one of those two
# addresses fall through to a stale static entry instead of aborting. The
# relocatable image serves every OTHER base, which is the set that was growing.
#
# Generated by tools/build_transient_image_config.py from the pinned
# ELF and the hash-verified ROM. The extent is the ELF STT_FUNC size;
# the resume/data split below is the function's own mapping symbols
# translated through the copy bias, not hand arithmetic.
#
# Evidence: flash-driver working-area routine; DMA3 copies 0x38 words (0xe0 bytes) from ROM 0x08001dc8 to 0x03002400, 0x0300387c and (campaign trace #9553280..82) 0x03003f9c
#
# ELF: Func_1dc8 at 0x08001dc8, size 224 (0xe0), mode arm.
# Image SHA-1 c2e9ace3620fc779387d91100c97071ebf21640b.

[program]
name = "Golden Sun relocatable Func_1dc8 RAM image"
id = "golden_sun_usa_transient_func_1dc8_relocatable"
load_address = 0x08000000
size = 0x00800000
entry_pc = 0x03002400
speculative_literal_harvest = false
codegen_shards = 1

[identity]
sha1 = "5c4695205413df7db52b9a184815a07783999971"

[[code_copy]]
runtime_start = 0x03002400
source_start = 0x08001dc8
size = 0x000000e0
name = "relocatable_Func_1dc8_image"
note = "flash-driver working-area routine; DMA3 copies 0x38 words (0xe0 bytes) from ROM 0x08001dc8 to 0x03002400, 0x0300387c and (campaign trace #9553280..82) 0x03003f9c; image SHA-1 c2e9ace3620fc779387d91100c97071ebf21640b"

[[extra_func]]
addr = 0x03002400
mode = "arm"
name = "Func_1dc8_relocatable_image"
note = "ELF STT_FUNC entry Func_1dc8 installed at the observed copy destination"

[[resume_range]]
start = 0x03002400
end = 0x030024d0
mode = "arm"
note = "Func_1dc8 code run, ROM 0x08001dc8..0x08001e98"

[[data_range]]
start = 0x030024d0
end = 0x030024e0
note = "ELF $d run inside Func_1dc8, ROM 0x08001e98..0x08001ea8"
