# GS-011 identity-verified AOT variant for Func_158e8 in the 0x0300347c staging
# slot — the fifth routine observed at that address.
#
# Input-driven strict-static evidence (3,600-frame campaign run). A DMA3 watch
# on 0x0300347c over the whole run counts:
#
#     219 x src=0x08009bb8  177 words (0x2c4)   Func_9bb8
#      12 x src=0x08015430   80 words (0x140)   Func_15430
#       4 x src=0x08002544  177 words (0x2c4)   Func_2544
#       1 x src=0x080158e8  133 words (0x214)   Func_158e8  <- this image
#
# The single Func_158e8 copy is what the strict-static run aborts on, and its
# 133-word DMA extent matches the ELF STT_FUNC size exactly.
#
# goldensun.elf .symtab: Func_158e8 at 0x080158e8, size 532 (0x214), section
# rom_15000, `$a` at the entry. It ends at 0x08015afc, immediately before
# Func_15afc — the routine already registered at 0x03003a84 — so the whole
# flash-driver cluster is drawn from one contiguous ROM region.
#
# Two interior `$d` literal pools at 0x08015948..0x08015998 and
# 0x08015a0c..0x08015a60 map through the verbatim copy bias to runtime
# 0x030034dc..0x0300352c and 0x030035a0..0x030035f4, and are excluded below.
#
# Image SHA-1 03e57ceee902e248334bb546cd32716edf90fca3.

