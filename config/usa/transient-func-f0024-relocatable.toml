# GS-011 POSITION-INDEPENDENT AOT image for Func_f0024.
#
# The ending credits' bitstream decoder. It is the same decoder as Func_b5138
# (transient-func-b5138-relocatable.toml): same 0x230 extent, same $d layout,
# same self-relocating 8-entry jump table; 88 bytes differ (the shift/add
# constants of the unpack loop and the table base word).
#
# Evidence: session 20261002_134927 reached the credits and reported
# "unknown transient code identity at 0x0300347C" with live_prefix
# e04f2de902a0a0e1c0209fe5ec308fe2022043e0c4408fe20850a0e3046093e4. That
# 32-byte prefix occurs exactly once in the hash-verified ROM, at 0x080f0024.
# The copier's literal pool at ROM 0x080f0360..0x080f0370 holds
# 0x00000230, 0x040000D4 (DMA3SAD), 0x080F0024, 0x03001E50: a 0x230-byte
# DMA3 copy from 0x080f0024, which is goldensun.elf's STT_FUNC Func_f0024,
# size 0x230. Every PC the session bridged through the interpreter
# (0x0300347C, 0x03003498, 0x03003550, 0x0300359C..0x0300369C) is inside this
# extent at base 0x0300347c, and the seven distinct jump-table cases below
# are exactly the seven case PCs it bridged.
#
# Generated with `gba_recompile --relocatable-image 0x0300347c:0x230`.
# 0x0300347c is the generation ORIGIN only; the runtime registry translates a
# live PC by subtracting the verified base.
#
# ELF: Func_f0024 at 0x080f0024, size 560 (0x230), mode arm.
# Image SHA-1 (whole extent, before self-relocation)
# 5b2df8ba8dfdf8614287530fba0c1749ed07f76e.

[program]
