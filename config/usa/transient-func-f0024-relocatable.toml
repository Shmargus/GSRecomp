name = "Func_f0024_relocatable_image"
note = "ELF STT_FUNC entry Func_f0024 installed at the observed copy destination"

# Interior entry points. The loop at the entry reads the 8-word table of
# ROM-absolute addresses at ROM 0x080f0124..0x080f0144
# {0x080f0144, 0x080f0160, 0x080f0200, 0x080f01b0, 0x080f0144, 0x080f0188,
# 0x080f0230, 0x080f01d8}, adds the copy bias and writes them into the
# placeholder table at ROM 0x080f0104..0x080f0124, which
# `and ip, r3, #7; ldr pc, [pc, ip, lsl #2]` at ROM 0x080f00f8 dispatches
# through. The seven distinct targets, translated through the image base,
# are this image's interior entries; all lie in the $a run
# [0x080f0144, 0x080f0254).

