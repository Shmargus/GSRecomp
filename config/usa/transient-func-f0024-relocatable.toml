name = "relocatable_Func_f0024_image"
note = "credits decoder; copier pool at ROM 0x080f0360: 0x230 bytes, DMA3SAD, source 0x080f0024; observed base 0x0300347c in session 20261002_134927; image SHA-1 5b2df8ba8dfdf8614287530fba0c1749ed07f76e"

[[extra_func]]
