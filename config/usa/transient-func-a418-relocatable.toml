# GS-011 POSITION-INDEPENDENT AOT image for Func_a418.
#
# Same ROM routine already registered FIXED at runtime base 0x03003400
# (config/usa/transient-func-a418-03003400.toml) - Func_a418 is a pooled
# flash-driver/copy routine, and this is another allocator base for it, the
# same "routine and base vary independently" pattern documented for
# Func_15430/Func_9bb8/etc. in docs/GS011_TRANSIENT_IMAGES.md. Registering it
# position-independent from the start avoids enumerating a third base later.
#
# Generated with `gba_recompile --relocatable-image 0x03002000:0x7c`, so it is
# registered position-independent rather than per base. 0x03002000 is the
# generation ORIGIN only.
#
# Evidence: unknown transient code identity abort at 0x03002000, savestate
# frame 15982; all 16 registered fixed images and the Func_15430 declared
# occupant failed identity (292 differing bytes). Searching the hash-verified
# ROM for the live 32-byte prefix (`BICS r1,r1,#7; TSTNE r2,#7; BXEQ lr;
# PUSH {r5-r11}; MOV r12,r1; LDM r0,{r4,r5}; ADD r0,r0,r1; LDM r0,{r6,r7}`)
# finds exactly ONE match, at ROM file offset 0xa418 = 0x0800a418.
# goldensun.elf has a sized STT_FUNC `Func_a418` starting exactly there, size
# 124 (0x7c), with a single $a (ARM) mapping symbol covering the whole extent
# and no interior $d - matching the runtime entry state (cpsr=0x1f, T clear).
# Independent extent confirmation: rom_9000/src/rom_b798.s (Func_bb20) DMA3s
# SAD=Func_a418, DAD=an allocator-returned buffer, CNT=0x84000000|0x1f
# (enable, 32-bit, 31 words = 0x7c bytes) - the disassembled DMA word count
# agrees with the ELF STT_FUNC size exactly, and the computed image SHA-1
# matches the already-registered 0x03003400 identity byte for byte.
#
# Generated by tools/build_transient_image_config.py from the pinned
# ELF and the hash-verified ROM. The extent is the ELF STT_FUNC size;
# the resume/data split below is the function's own mapping symbols
# translated through the copy bias, not hand arithmetic.
#
# ELF: Func_a418 at 0x0800a418, size 124 (0x7c), mode arm.
# Image SHA-1 d3261b6f7b57ba4e7da8e44cf555d009c7cc27d1.

[program]
name = "Golden Sun relocatable Func_a418 RAM image"
id = "golden_sun_usa_transient_func_a418_relocatable"
load_address = 0x08000000
size = 0x00800000
entry_pc = 0x03002000
speculative_literal_harvest = false
codegen_shards = 1

[identity]
sha1 = "5c4695205413df7db52b9a184815a07783999971"

[[code_copy]]
runtime_start = 0x03002000
source_start = 0x0800a418
size = 0x0000007c
name = "relocatable_Func_a418_image"
note = "unknown transient code identity abort at 0x03002000, savestate frame 15982; ROM search of the hash-verified ROM for the live 32-byte prefix finds exactly one match at file offset 0xa418 = ROM 0x0800a418; DMA3 writer confirmed separately in rom_9000/src/rom_b798.s (Func_bb20): SAD=Func_a418, DAD=allocator-returned buffer, CNT=0x84000000|0x1f (enable, 32-bit, 31 words = 0x7c bytes), matching the ELF STT_FUNC size exactly; Func_a418 is already a registered fixed image at runtime base 0x03003400 with the identical ELF source/size/SHA-1, confirming routine-vs-base independence (D-005); image SHA-1 d3261b6f7b57ba4e7da8e44cf555d009c7cc27d1"

[[extra_func]]
addr = 0x03002000
mode = "arm"
name = "Func_a418_relocatable_image"
note = "ELF STT_FUNC entry Func_a418 installed at the observed copy destination"

[[resume_range]]
start = 0x03002000
end = 0x0300207c
mode = "arm"
note = "Func_a418 code run, ROM 0x0800a418..0x0800a494"
