# GS-011 identity-verified AOT variant for Func_15afc, DMA-copied into IWRAM at
# 0x03003a84.
#
# Strict-static evidence (1800-frame run, trace events #4697284..#4697295):
#   - #4697284/#4697285 PC 0x080048e2 publishes the image bounds into the
#     descriptor at 0x03001e50: end 0x03003cfc and start 0x03003a84.
#   - #4697289..#4697291 PC 0x0801a5c8 programs DMA3 SAD=0x08015afc
#     DAD=0x03003a84 CNT=0x8400009e — 0x9e words = 0x278 bytes. 0x03003a84 +
#     0x278 = 0x03003cfc, which matches the descriptor exactly.
#   - #4697292..#4697295 call through _call_via_r3 with r3 = 0x03003a84 and
#     exchange to it with CPSR.T clear (cpsr=0x0000001f), so the entry runs ARM.
#
# goldensun.elf .symtab agrees: Func_15afc at 0x08015afc, size 632 (0x278),
# section rom_15000, with an `$a` mapping symbol at the entry and the next
# function Func_15d74 beginning at exactly 0x08015d74. The DMA extent and the
# ELF extent are the same bytes.
#
# The only interior mapping transition is the `$d` literal pool at
# 0x08015b30..0x08015b38, which maps to runtime 0x03003ab8..0x03003ac0 and is
# excluded below so no resume alias decodes it as an instruction.
#
# Hash-verified ROM bytes give image SHA-1
# f6ab01b56876f8d1b72a4bf5239bd5cbac620cb0.

