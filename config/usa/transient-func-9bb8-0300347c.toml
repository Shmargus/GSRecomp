# GS-011 identity-verified AOT variant for Func_9bb8, DMA-copied into the
# 0x0300347c staging slot.
#
# This is the fourth routine observed at 0x0300347c, after Func_2544,
# Func_15430 and (adjacent) Func_15570. A DMA3 watch on the address over one
# 3,600-frame campaign run records the three sources in proportion:
#
#     147 x src=0x08009bb8  177 words (0x2c4)
#       8 x src=0x08015430   80 words (0x140)
#       4 x src=0x08002544  177 words (0x2c4)
#
# so Func_9bb8 is in fact the slot's dominant occupant during gameplay; the
# previously registered images are the boot-time ones. Address is emphatically
# not a dispatch key here.
#
# Evidence:
#   - DMA3 watch on 0x0300347c: src=0x08009bb8, 177 words = 0x2c4 bytes, ch 3.
#   - The live window captured at the strict-static abort matches ROM
#     0x08009bb8 byte for byte for exactly 0x2c4 bytes.
#   - goldensun.elf .symtab: Func_9bb8 at 0x08009bb8, size 708 (0x2c4),
#     section rom_9000, `$a` at the entry; the next function Func_9e7c begins
#     at exactly 0x08009e7c.
#
# Func_9bb8 carries three interior `$d` literal pools, which map through the
# verbatim copy bias to runtime 0x03003550..0x03003554, 0x030035a0..0x030035c0
# and 0x03003654..0x03003740. They are excluded so no resume alias decodes a
# literal as an instruction.
#
# Image SHA-1 38da8bb7176c71ef1e86ce50346af1d72174529c.

