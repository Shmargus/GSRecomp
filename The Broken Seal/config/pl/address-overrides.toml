# Reviewed counterparts in the Polish translation of Golden Sun (gspl_1v.ppf,
# PPF3 on the verified USA/Europe ROM) that the address map cannot give by
# itself (tools/build_rom_address_table.py). Measured 26 November 2026;
# local/pl/address-map.json. Below 0x08800000 the patched ROM equals USA
# except Func_15430/Func_15570's first 0x14/0x2C bytes (byte-identical to the
# Portuguese patch's), one cmp immediate in Func_155d0 (0x080155F0: 0x6F ->
# 0xFF, the font's highest character), font glyphs 0x080336A8..0x08033CFC and
# image data 0x08322830..0x08322E8F; the header is unchanged. Its text is a
# plain table appended at 0x08800000, as the Portuguese patch's.

[[rom]]
usa = 0x08015430
polish = 0x08015430
evidence = "RAM-code copy source of Func_15430: the routine starts in place; the patch rewrote its first 0x14 bytes as the Portuguese patch did (next text byte from a plain pointer), the copy size and destinations are unchanged (config/pl transient-images.json)"

[[rom]]
usa = 0x08015570
polish = 0x08015570
evidence = "RAM-code copy source of Func_15570: the routine starts in place; the patch rewrote its first 0x2C bytes as the Portuguese patch did (line start from the plain offset table), the copy size and destinations are unchanged (config/pl transient-images.json)"

[[rom]]
usa = 0x080000B8
polish = 0x080000B8
evidence = "cartridge header word used as a constant zero: reads 0x00000000 in both ROMs (the patch leaves the header unchanged)"

[[rom]]
usa = 0x080736B8
polish = 0x080736B8
evidence = "Huffman text table: bytes unchanged in place, but the patched Func_15570 no longer reads it (its literal now names the plain offset table 0x08800000 and text base 0x0880A7F0); feature text reads use the plain table (gs::plain_text)"

