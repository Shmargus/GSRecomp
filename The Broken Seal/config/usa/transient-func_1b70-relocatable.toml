# GS-011 POSITION-INDEPENDENT AOT image for Func_1b70.
#
# A NEW routine in the flash driver's relocatable working area, found by the
# 5,400-frame campaign run: the 1,800-frame run never installs it. Relocation
# removes the need to enumerate BASES, not the need to discover ROUTINES, and
# this is exactly that case - an unknown identity at 0x0300387c, 208 bytes
# different from the Func_1dc8 image that address had been hosting.
#
# Generated with `gba_recompile --relocatable-image 0x0300387c:0x258`, so it is
# registered position-independent from the start rather than per base.
# 0x0300387c is the generation ORIGIN only.
#
#
# Generated by tools/build_transient_image_config.py from the pinned
# ELF and the hash-verified ROM. The extent is the ELF STT_FUNC size;
# the resume/data split below is the function's own mapping symbols
# translated through the copy bias, not hand arithmetic.
#
# Evidence: DMA3 watch on 0x0300387c records ch=3 src=0x08001b70 word=0/150 cnt_h=0x8400 (150 words = 0x258 bytes) as the last writer before the abort; the live first word 0xE92D40E2 matches ROM 0x08001b70 and goldensun.elf sizes Func_1b70 at exactly 600 (0x258) bytes with an $a at the entry
#
# ELF: Func_1b70 at 0x08001b70, size 600 (0x258), mode arm.
# Image SHA-1 7e06447b0578b9d6ea559eda377aafdd6faecdbe.

[program]
name = "Golden Sun relocatable Func_1b70 RAM image"
id = "golden_sun_usa_transient_func_1b70_relocatable"
