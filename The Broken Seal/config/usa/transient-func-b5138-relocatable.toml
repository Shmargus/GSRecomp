# GS-011 POSITION-INDEPENDENT AOT image for Func_b5138.
#
# Func_b5138 is a transient allocator block copied into IWRAM at whatever base
# the allocator hands out - the same pattern as the Func_2d5c/Func_15430
# transient images. Base observed so far: 0x0300207c, from the first scripted
# fight. That is one observed base, not a closed set; other routes will hand
# out other allocator bases.
#
# Generated with `gba_recompile --relocatable-image 0x0300207c:0x230`: every guest
# address the image derives from its own PC is emitted as
# g_runtime_image_base + offset. 0x0300207c is the generation ORIGIN only - the
# dispatch table, goto labels and resume tokens stay expressed in it, and the
# runtime registry translates a live PC by subtracting the verified base.
#
#
# Generated by tools/build_transient_image_config.py from the pinned
# ELF and the hash-verified ROM. The extent is the ELF STT_FUNC size;
# the resume/data split below is the function's own mapping symbols
# translated through the copy bias, not hand arithmetic.
#
# Evidence: runtime_trace events #55889096-#55889105. Allocator writes next-free
# 0x030022AC = 0x0300207C + 0x230 (event #55889096) and records the block base
# 0x0300207C (event #55889097). DMA3SAD=0x080B5138, DMA3DAD=0x0300207C,
# DMA3CNT=0x8400008C - enable, 32-bit, 0x8C words = 0x230 bytes (events
# #55889100-#55889102), independently confirming the size the allocator
# recorded. `_call_via_r3` dispatches with r3=0x0300207C (event #55889104) and
# the exchange at 0x0300207C carries cpsr=0x0000001F, T bit clear => ARM
# (event #55889105).
#
# ELF: Func_b5138 at 0x080b5138, size 560 (0x230), mode arm.
# Image SHA-1 ec38094f7b1c2b14f7af17fdeb0072aa84d34ebe.

[program]
name = "Golden Sun relocatable Func_b5138 RAM image"
id = "golden_sun_usa_transient_func_b5138_relocatable"
load_address = 0x08000000
size = 0x00800000
entry_pc = 0x0300207c
speculative_literal_harvest = false
codegen_shards = 1

[identity]
sha1 = "5c4695205413df7db52b9a184815a07783999971"

[[code_copy]]
runtime_start = 0x0300207c
source_start = 0x080b5138
size = 0x00000230
name = "relocatable_Func_b5138_image"
note = "runtime_trace events #55889096-#55889105: allocator base 0x0300207c, next-free 0x030022ac; DMA3SAD=0x080b5138, DMA3DAD=0x0300207c, DMA3CNT=0x8400008c (0x230 bytes); exchange cpsr=0x1f, T clear => ARM; image SHA-1 ec38094f7b1c2b14f7af17fdeb0072aa84d34ebe"

[[extra_func]]
addr = 0x0300207c
mode = "arm"
name = "Func_b5138_relocatable_image"
note = "ELF STT_FUNC entry Func_b5138 installed at the observed copy destination"

# Interior entry points. Func_b5138 self-relocates: the loop at ROM
# 0x080b5138..0x080b5164 reads an 8-word table of ROM-ABSOLUTE addresses from
# 0x080b5238..0x080b5258 (the jump-table literal pool for its own bitstream
# decoder dispatch: `and ip, r3, #7; ldr pc, [pc, ip, lsl #2]` at ROM
# 0x080b520c reads through PC+8 = 0x080b5218), adds the copy bias, and writes
# the 8 relocated words back into the placeholder table at ROM-offset
# 0x080b5218..0x080b5238 (inside the declared data_range
# 0x0300215c..0x0300219c above). Those 8 relocated words ARE the jump-table
# entries the decoder's `ldr pc` dispatches through, so they are this image's
# interior entry points - the 8 source ROM addresses translated through the
# image base.
#
# Derived authoritatively from the pinned ELF/ROM (disassembly revision
# 84a80693003439acdbb78dd84538b0532461ad4b, ROM SHA-1
# 5c4695205413df7db52b9a184815a07783999971), not from the runtime trace:
# `arm-none-eabi-objdump -d --start-address=0x080b5138
# --stop-address=0x080b5368 goldensun.elf` shows the source table at ROM
# 0x080b5238..0x080b5258 holding the 8 words
# {0x080b5258, 0x080b5274, 0x080b5314, 0x080b52c4, 0x080b5258, 0x080b529c,
# 0x080b5344, 0x080b52ec} (0x080b5258 repeats - the decoder has two zero-delta
# cases). The 7 DISTINCT values below, translated through
# runtime = 0x0300207c + (rom - 0x080b5138), match every one of the 7
# addresses observed live at runtime (cross-check, not source of truth):
# 0x0300219c, 0x030021b8, 0x030021e0, 0x03002208, 0x03002230, 0x03002258,
# 0x03002288.
#
# Mode: `arm-none-eabi-readelf -s goldensun.elf` shows a single $a mapping
# symbol at 0x080b5258 running uninterrupted (no further $t/$d before it) to
# the next STT_FUNC boundary at 0x080b5368 (Func_b5368). All 7 ROM addresses
# below sit inside that one $a run, so all 7 are ARM - verified per entry,
# not assumed from the block's first address.

[[extra_func]]
addr = 0x0300219c
mode = "arm"
name = "Func_b5138_relocatable_case_0"
note = "ROM 0x080b5258: relocated table[0]==table[4]; inside the single $a run [0x080b5258,0x080b5368) per readelf -s, no intervening $d/$t; matches observed runtime PC 0x0300219c"

