name = "relocatable_Func_1ea8_image"
note = "spell canvas copy-and-fade helper, DMA3-copied onto the stack by Func_54e4; pool at 0x08005528 holds byte-count 0x50, DMA3 SAD reg 0x040000D4, source 0x08001EA8"

[[extra_func]]
addr = 0x03007c14
