#   - Store trace: Func_6ac0 PC 0x08006ae6 copies halfwords 0x7800 and
#     0x4770 from 0x08006abc and 0x08006abe to that stack address.
#   - goldensun.elf/source bounds Func_6abc as 0x08006abc..0x08006ac0,
