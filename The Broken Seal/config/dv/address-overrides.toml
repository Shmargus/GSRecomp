# Reviewed Dawn of Djinn 2.0.5 Veteran counterparts the address map cannot give by itself
# (tools/build_rom_address_table.py). Measured 25 November 2026 against the
# verified USA/Europe ROM; local/dd/veteran/address-map.json.

[[rom]]
usa = 0x08015430
dawn_veteran = 0x08015430
evidence = "RAM-code copy source of Func_15430: the routine starts in place, byte-identical to the Portuguese patch's (first 0x14 bytes rewritten: next text byte from a plain pointer); copy size and destinations unchanged (config/dv transient configs)"

[[rom]]
usa = 0x08015570
dawn_veteran = 0x08015570
evidence = "RAM-code copy source of Func_15570: the routine starts in place, byte-identical to the Portuguese patch's (first 0x2C bytes rewritten: line start from the plain offset table 0x08800000); copy size and destinations unchanged (config/dv transient configs)"

[[rom]]
usa = 0x08015140
dawn_veteran = 0x08015140
evidence = "Interworking veneer in place (ldr r4,[pc,#0]; bx r4); only its target word changed, to the hack's wrapper 0x08890F41, which ends by jumping to USA's own target 0x08019A55 (literal 0x08891094) or 0x0809C139 (literal 0x08891098). Entering the veneer keeps its role (25 November 2026)."

[[rom]]
usa = 0x080736B8
dawn_veteran = 0x080736B8
evidence = "Huffman text table: rewritten in place, and the patched Func_15570 (byte-identical to the Portuguese patch's) no longer reads it (its literals name the plain offset table 0x08800000 and text base 0x0880A7F0); feature text reads use the plain table (gs::plain_text)"

