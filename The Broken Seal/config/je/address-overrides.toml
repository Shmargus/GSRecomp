# Reviewed Jenna Edition 1.0.0 Modern counterparts the address map cannot give by itself
# (tools/build_rom_address_table.py). Measured 26 November 2026 against the
# verified USA/Europe ROM; local/je/address-map.json. Same author and same
# changed routines as Dawn of Djinn 2.0.5 (byte-identical but Func_b6f44), so
# the Dawn of Djinn entries carry over: each was re-checked on this ROM.

[[rom]]
usa = 0x08015430
jenna_modern = 0x08015430
evidence = "RAM-code copy source of Func_15430: the routine starts in place, byte-identical to the Portuguese patch's (first 0x14 bytes rewritten: next text byte from a plain pointer); copy size and destinations unchanged (config/dc transient configs)"

[[rom]]
usa = 0x08015570
jenna_modern = 0x08015570
evidence = "RAM-code copy source of Func_15570: the routine starts in place, byte-identical to the Portuguese patch's (first 0x2C bytes rewritten: line start from the plain offset table 0x08800000); copy size and destinations unchanged (config/dc transient configs)"

[[rom]]
usa = 0x08015140
jenna_modern = 0x08015140
evidence = "Interworking veneer in place (ldr r4,[pc,#0]; bx r4); only its target word changed, to the hack's wrapper 0x08890F41, which ends by jumping to USA's own target 0x08019A55 (literal 0x08891094) or 0x0809C139 (literal 0x08891098). Entering the veneer keeps its role (Dawn of Djinn, 25 November 2026; same bytes in Jenna Edition, 26 November 2026)."

[[rom]]
usa = 0x080736B8
jenna_modern = 0x080736B8
evidence = "Huffman text table: rewritten in place, and the patched Func_15570 (byte-identical to the Portuguese patch's) no longer reads it (its literals name the plain offset table 0x08800000 and text base 0x0880A7F0); feature text reads use the plain table (gs::plain_text)"

