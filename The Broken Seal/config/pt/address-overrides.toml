# Reviewed counterparts in Kyle the Runner's Brazilian Portuguese Beta 1.01
# (IPS on the verified USA/Europe ROM) that the address map cannot give by
# itself (tools/build_rom_address_table.py). Measured 19 November 2026;
# local/pt/address-map.json. Below 0x08800000 the patched ROM equals USA
# except the header title (0xA0..0xAB) and Func_15430/Func_15570's first
# 0x14/0x2C bytes; its text is a plain table appended at 0x08800000.

[[rom]]
usa = 0x08015430
portuguese = 0x08015430
evidence = "RAM-code copy source of Func_15430: the routine starts in place; the patch rewrote its first 0x14 bytes (next text byte from a plain pointer), the copy size and destinations are unchanged (config/pt transient-images.json)"

[[rom]]
usa = 0x08015570
portuguese = 0x08015570
evidence = "RAM-code copy source of Func_15570: the routine starts in place; the patch rewrote its first 0x2C bytes (line start from the plain offset table), the copy size and destinations are unchanged (config/pt transient-images.json)"

[[rom]]
usa = 0x080000B8
portuguese = 0x080000B8
evidence = "cartridge header word used as a constant zero: reads 0x00000000 in both ROMs (the patch changes only the title, 0xA0..0xAB)"

[[rom]]
usa = 0x080736B8
portuguese = 0x080736B8
evidence = "Huffman text table: bytes unchanged in place, but the patched Func_15570 no longer reads it (its literal now names the plain offset table 0x08800000 and text base 0x0880A7F0); feature text reads use the plain table (gs::plain_text)"

